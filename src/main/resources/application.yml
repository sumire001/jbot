server:
  port: 3939

spring:
  devtools:
    restart:
      enabled: false  # 禁用热重载，避免类加载器冲突
  thymeleaf:
    cache: false  # 开发环境关闭缓存
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 6MB       # 单个文件最大 6MB（业务上限 5MB + 余量）
      max-request-size: 6MB    # 整个请求最大 6MB

# Bot配置
bot:
  #   admin:
  #     qq-list:
  #       - 你的管理员QQ
  # AI聊天配置
  ai:
    enabled: false  # 是否启用AI功能
    api-key:
    api-url: #https://dashscope.aliyuncs.com/compatible-mode/v1 阿里云百练
    model: #qwen-plus
    max-tokens: 1024  # 最大回复Token数
    summary-max-tokens: 2048  # 长期记忆摘要调用的 max_tokens 上限（推理模型会把额度花在 thinking 上，过小会被截断导致画像写不进去）
    thinking-enabled: false  # 是否开启思考模式；关闭后 temperature 恢复生效、更便宜、且摘要不会被推理挤占预算。deepseek-v4-flash 默认开启思考，这里显式关掉
    temperature: 0.7  # 生成随机性（0-1，越高越随机）
    timeout-seconds: 60  # API请求超时时间（秒）
    history-max-context: 10  # 短期记忆最大对话轮数（每轮含user+assistant两条消息）
    # 短期记忆持久化（重启后恢复最近对话；临时缓存性质，不替代长期记忆）
    conversation-persist-enabled: true      # 是否落盘；关闭则纯内存、重启即丢
    conversation-save-every-rounds: 3      # 每满 N 轮对话刷一次盘（崩溃最多丢约 N 轮）；优雅停机仍会全量落盘
    conversation-max-idle-hours: 72        # 会话空闲超此时长（小时）判定过期并删除
    conversation-storage-path: data/conversation_history.json  # 落盘文件路径（相对工作目录）
    # 工具调用（Function Calling）：让 LLM 可查时间/网页以保准确性
    tools-enabled: true            # 是否启用工具调用（LLM 可主动查时间/网页查证）
    tool-max-rounds: 5            # 工具循环最大轮数（防死循环）
    search-engine: duckduckgo     # 网页搜索后端：duckduckgo（无key）/ baidu（国内备选）
    search-max-results: 5         # 网页搜索返回条数上限
    long-term-memory:
      enabled: true           # 是否启用长期记忆
      memory-dir: ./data/memory  # 文件存储目录
      flush-interval-minutes: 5  # 定时刷盘间隔（分钟）
      max-members-per-group: 50  # 每群最多保留成员数
      inactive-days-to-remove: 30  # 不活跃用户移除天数
      summary-cooldown-minutes: 10  # 摘要冷却时间
      max-traits-length: 300  # 单用户画像(traits)落盘最大字符数（安全阀，防 LLM 写出超长文本；非成本项）
      max-group-context-chars: 600  # 注入聊天上下文的群成员画像总长上限（真正控制每条消息 token 成本，超出按人头截断）
  # 命令配置
  command:
    prefix: "/"  # 命令前缀，所有命令必须以此开头
    # 别名通过 WebUI 配置，不在此处硬编码默认值（避免 Spring Boot Map 合并导致重置）
  # 图片存储配置
  images:
    root-dir: ./data/images  # 图片根目录，默认 ./data/images（相对于工作目录）
    # 图片下载配置
    download:
      max-size-mb: 10  # 单张图片最大下载大小（MB）
    # 图片压缩配置
    compression:
      size-threshold-mb: 1  # 超过此大小的图片才会被压缩（MB）
      max-dimension: 1600  # 最大分辨率（最长边像素数）
      jpeg-quality: 0.75  # JPEG压缩质量（0.0-1.0）
      skip-gif: true  # 是否跳过GIF文件（可能是动画）
  # 消息缓存配置
  cache:
    message-max-size: 100  # 消息缓存最大数量
  # Temp目录清理配置
  temp:
    retention-days: 7  # 文件保留天数
    clean-cron: "0 0 3 * * ?"  # 定时清理：每天凌晨3点
    max-file-size-mb: 50  # 单个文件大小参考值（超过则更易被清理）
    max-dir-size-mb: 200  # 目录总大小上限 200MB
    pixiv-retention-hours: 24  # Pixiv缓存保留 24 小时
    pixiv-clean-cron: "0 0 * * * ?"  # Pixiv清理：每小时
    pixiv-max-dir-size-mb: 500  # Pixiv缓存目录上限 500MB
  # 二次元图片API配置
  anime-api:
    url: https://api.lolicon.app/setu/v2  # Lolicon API 地址
  # 词汇数据存储配置
  vocabulary:
    data-dir: ./data/vocabulary  # 词汇JSON文件存储目录
  # 远程 git 仓库查询（JGit 直连 git 协议，默认不依赖平台 API）
  git:
    cache-dir: ./data/git-cache   # 浅克隆缓存目录（每个查询过的仓库存一份）
    timeout-seconds: 30           # clone/fetch/ls-remote 网络超时（秒）
    clone-depth: 20               # 浅克隆深度（决定 log 可回溯的历史条数 / 首次克隆体积）
    default-repo:                 # 默认仓库地址；git_query 省略 repo 时使用（如 https://github.com/owner/repo.git）
    username: git                # HTTPS 鉴权用户名（配合下方 token 作密码，任意非空即可）
    token:                        # 私有库的个人访问令牌（PAT）；也可通过环境变量 GIT_TOKEN 注入，勿提交进仓库
    issues-enabled: false        # issues 是平台概念、需调平台 API，默认关闭；true 且配 token 后生效
    issues-max: 10               # issues 单次返回条数上限
  # pjsk B30 查询（路线 C：直连数据源 + 绑定表 + 定数表 + HTML 截图）
  sekai:
    # 各服数据源 base URL：Haruki 工具箱「公有读」接口（公开读，无需 token）
    #   GET https://suite-api.haruki.seiunx.com/public/{region}/suite/{uid}
    #   支持 cn/jp/tw/kr/en 五服；{uid} 由玩家游戏内 9 位 ID 自动替换。
    #   后续若要换自建 gameapi 后端，改这里即可（并视情况填 api-token）。
    suite-api-url:
      jp: https://suite-api.haruki.seiunx.com/public/jp/suite/{uid}
      cn: https://suite-api.haruki.seiunx.com/public/cn/suite/{uid}
      tw: https://suite-api.haruki.seiunx.com/public/tw/suite/{uid}
      en: https://suite-api.haruki.seiunx.com/public/en/suite/{uid}
      kr: https://suite-api.haruki.seiunx.com/public/kr/suite/{uid}
    api-token:                    # Haruki 公有读无需 token；仅自建需要 Bearer 鉴权的后端才填；勿提交进仓库
    default-mode: default        # 预留给自建后端（Haruki 公有读忽略此参数）
    # 定数表来源（逗号分隔可填多个，后者覆盖前者）。支持三种形式：
    #   - classpath:sekai/constants.csv  自托管 CSV（当前使用，随 jar 分发，断网可用）
    #   - file:/abs/path/constants.csv   本地文件
    #   - http(s)://...                  远程拉取（首次拉后落盘，断网可用）
    # 也兼容历史 JSON（顶层平铺 "musicId:diff" -> 定数）。留空则跳过刷新。
    # 自托管 CSV 说明（resources/sekai/constants.csv，159KB，2219 条）：
    #   - 数据源自 pjskb30 社区定数表，经 Moesekai 镜像合并：
    #       https://moe.exmeaning.com/data/pjskb30/merged_chart.csv
    #   - 列：0 社区英文名, 1 JP原名, 2 定数, 3 等级(37+/APD 38), 4 物量, 5 难度, 6 songId, 7 中文曲名(sekai-i18n 合并)
    #   - 更新方式：重新下载上面的 merged_chart.csv，用中文曲名补第 8 列后覆盖本文件即可
    constant-url: classpath:sekai/constants.csv
    constant-refresh-ms: 86400000 # 定数表刷新间隔（ms），默认 1 天
    constants-updated-at: 2026-10-24  # 定数表数据日期（显示在图头部；更新 CSV 时同步改这里）
    profile-cache-ttl-ms: 3600000 # profile 内存缓存 TTL（ms），默认 1 小时
    data-dir: ./data/sekai       # 绑定表 / 定数表落盘目录
    # ---- 曲绘封面（storage.exmeaning.com 的 pjsk assets 镜像，缩略图约 70KB）----
    jacket-url-template: https://storage.exmeaning.com/sekai-{region}-assets/thumbnail/music_jacket/jacket_s_{id}.webp
    jacket-cache-dir: ./data/sekai/jackets  # 封面磁盘缓存目录
    jacket-timeout-ms: 8000      # 单张封面下载超时（ms）
    jacket-parallelism: 8        # 封面并行下载线程数
    # ---- B30 图片渲染（本地无头 Chromium，见 SekaiImageRenderer）----
    render-width: 960            # 渲染图宽度(px)，6 列网格
    # Android/Termux 部署：经 proot-distro 调 Debian 容器内的 chromium（Playwright 驱动在 bionic 上跑不了）
    # 普通 Linux 部署：把下面置空，直接调用 PATH 里的 chromium
    render-proot-bin: /data/data/com.termux/files/usr/bin/proot-distro
    render-container: debian     # chromium 装在哪个 proot-distro 容器
    render-temp-dir: ./data/sekai/render  # 渲染临时目录，需在 Termux home 下以便容器读写

# Spring Boot Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,heapdump,threaddump  # 开放监控端点
  endpoint:
    health:
      show-details: always  # 显示健康检查详情
    metrics:
      enabled: true
  metrics:
    tags:
      application: j-one-bot
