<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=1">
    <title>命令设置 - ichikaBot</title>
    <link rel="stylesheet" href="/css/theme.css?v=20260816">
    <link rel="stylesheet" href="/css/config.css?v=20260816">
    <!-- Lucide 矢量图标库（defer：并行加载，不阻塞页面渲染） -->
    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <img src="/favicon.png?v=1" class="sidebar-brand-logo" alt="ichikaBot">
                <div class="sidebar-brand-text">
                    <span class="sidebar-logo-text">ichikaBot</span>
                    <span class="sidebar-logo-sub">webui</span>
                </div>
            </div>
            <button class="sidebar-collapse-btn" id="collapse-btn" onclick="ThemeManager.toggleSidebarCollapse()" title="收起侧边栏">
                <svg class="nav-icon collapse-icon-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
                <svg class="nav-icon collapse-icon-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group-title">监控中心</div>
            <a href="/" class="nav-item">
                <i data-lucide="layout-dashboard" class="nav-icon"></i>
                <span>概览 Dashboard</span>
            </a>
            <a href="/monitor-page" class="nav-item">
                <i data-lucide="activity" class="nav-icon"></i>
                <span>实时监控 Monitor</span>
            </a>

            <div class="nav-group-title">核心配置</div>
            <a href="/command-page" class="nav-item active">
                <i data-lucide="terminal" class="nav-icon"></i>
                <span>命令设置</span>
            </a>
            <a href="/ai-models-page" class="nav-item">
                <i data-lucide="cpu" class="nav-icon"></i>
                <span>AI 模型配置</span>
            </a>
            <a href="/search-source-page" class="nav-item">
                <i data-lucide="search" class="nav-icon"></i>
                <span>搜索源管理</span>
            </a>

            <div class="nav-group-title">资源管理</div>
            <a href="/memes-page" class="nav-item">
                <i data-lucide="image" class="nav-icon"></i>
                <span>表情包列表</span>
            </a>
            <a href="/batch-upload-page" class="nav-item">
                <i data-lucide="upload" class="nav-icon"></i>
                <span>批量上传</span>
            </a>

            <div class="nav-group-title">系统</div>
            <a href="/general-settings-page" class="nav-item">
                <i data-lucide="settings" class="nav-icon"></i>
                <span>通用设置</span>
            </a>
        </nav>
    </aside>

    <div id="sidebar-overlay" onclick="ThemeManager.closeSidebar()"></div>

    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" onclick="ThemeManager.toggleSidebar()"><i data-lucide="menu"></i></button>
            <img src="/favicon.png?v=1" class="topbar-logo" alt="logo">
            <span class="topbar-title">ichikaBot</span>
        </div>
        <div class="topbar-actions">
            <button class="btn btn-secondary btn-sm" onclick="handleLogout()">登出</button>
        </div>
    </header>

    <button class="sidebar-expand-btn" onclick="ThemeManager.toggleSidebarCollapse()" title="展开侧边栏">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
    </button>

    <main class="main-content">
        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">命令设置</h1>
                    <p class="page-subtitle">机器人命令前缀、别名映射与管理员权限</p>
                </div>
            </div>

            <!-- 命令配置 -->
            <div class="config-panel">
                <div class="config-panel-header">
                    <h2 class="config-panel-title">命令配置 <span class="badge">可热更新</span></h2>
                </div>
                <div class="config-panel-body">
                    <div class="form-group">
                        <label class="form-label">命令前缀</label>
                        <input type="text" id="cmd-prefix" class="form-input" maxlength="4" value="/" style="max-width: 120px;">
                        <div class="form-hint">所有命令必须以此开头，最长 4 字符。</div>
                    </div>

                    <!-- 统一表格：表头 -->
                    <div class="cmd-list-header">
                        <div class="col-cmd-name">主命令名</div>
                        <div class="col-cmd-alias">别名 (逗号分隔)</div>
                        <div class="col-cmd-perm">管理员权限</div>
                        <div class="col-cmd-action">操作</div>
                    </div>

                    <!-- 动态命令行容器 -->
                    <div id="cmd-list-container"></div>

                    <!-- 添加行 -->
                    <div class="cmd-add-row">
                        <div class="col-cmd-name">
                            <input type="text" id="cmd-new-key" class="form-input" placeholder="新命令名">
                        </div>
                        <div class="col-cmd-alias">
                            <input type="text" id="cmd-new-value" class="form-input" placeholder="别名(可选)">
                        </div>
                        <div class="col-cmd-perm">
                            <label class="switch-label">
                                <input type="checkbox" id="cmd-new-perm" class="switch-input">
                                <span class="switch-slider-sm"></span>
                                <span>需管理</span>
                            </label>
                        </div>
                        <div class="col-cmd-action">
                            <button class="btn-add" onclick="addCommandRow()">添加</button>
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="updateCommandConfig()" style="margin-top:20px;">保存全部配置</button>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="bottom-nav-items">
            <a href="/" class="bottom-nav-item"><i data-lucide="layout-dashboard" class="nav-icon"></i><span>概览</span></a>
            <a href="/monitor-page" class="bottom-nav-item"><i data-lucide="activity" class="nav-icon"></i><span>监控</span></a>
            <a href="/memes-page" class="bottom-nav-item"><i data-lucide="image" class="nav-icon"></i><span>表情</span></a>
            <a href="/batch-upload-page" class="bottom-nav-item"><i data-lucide="upload" class="nav-icon"></i><span>上传</span></a>
            <a href="/general-settings-page" class="bottom-nav-item"><i data-lucide="settings" class="nav-icon"></i><span>设置</span></a>
        </div>
    </nav>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/theme.js"></script>
    <script>
        function showToast(msg, type='info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function setGeneralTheme(theme) {
            ThemeManager.setTheme(theme);
            updateGeneralThemeUI();
            showToast('主题已更新', 'success');
        }

        function updateGeneralThemeUI() {
            const theme = ThemeManager.getTheme();
            document.querySelectorAll('.theme-radio').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === theme);
            });
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/status');
                const json = await res.json();
                if (!json.authenticated) window.location.href = '/login';
            } catch (e) {}
        }

        async function handleLogout() {
            try {
                const res = await fetch('/api/auth/logout', { method: 'POST' });
                if (res.ok) window.location.href = '/login';
            } catch (e) {
                window.location.href = '/login';
            }
        }

        function renderCommandList(aliases, permissions) {
            const container = document.getElementById('cmd-list-container');
            container.innerHTML = '';
            const allCmds = new Set([...Object.keys(aliases || {}), ...Object.keys(permissions || {})]);
            if (allCmds.size === 0) {
                container.innerHTML = '<div class="form-hint" style="padding:12px 16px;">暂无命令配置，可在下方添加</div>';
                return;
            }
            allCmds.forEach(cmd => {
                const alias = aliases[cmd] || '';
                const perm = !!(permissions || {})[cmd];
                const row = document.createElement('div');
                row.className = 'cmd-row';
                row.dataset.cmd = cmd;
                const nameCol = document.createElement('div');
                nameCol.className = 'col-cmd-name';
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'form-input cmd-cmd-name';
                nameInput.value = cmd;
                nameInput.readOnly = true;
                nameInput.style.background = 'var(--bg-tertiary)';
                nameInput.style.cursor = 'default';
                nameCol.appendChild(nameInput);
                const aliasCol = document.createElement('div');
                aliasCol.className = 'col-cmd-alias';
                const aliasInput = document.createElement('input');
                aliasInput.type = 'text';
                aliasInput.className = 'form-input cmd-cmd-alias';
                aliasInput.value = alias;
                aliasInput.placeholder = '逗号分隔';
                aliasCol.appendChild(aliasInput);
                const permCol = document.createElement('div');
                permCol.className = 'col-cmd-perm';
                const label = document.createElement('label');
                label.className = 'switch-label';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'switch-input cmd-perm-cb';
                cb.dataset.cmd = cmd;
                cb.checked = perm;
                const slider = document.createElement('span');
                slider.className = 'switch-slider-sm';
                const text = document.createElement('span');
                text.textContent = '需管理';
                if (cmd === 'enable') {
                    text.textContent = '需管理';
                    const hint = document.createElement('span');
                    hint.style.cssText = 'color:var(--text-secondary);font-size:11px;margin-left:2px;';
                    hint.title = '查看公开·修改需管理员';
                    hint.textContent = '*';
                    text.appendChild(hint);
                }
                label.appendChild(cb); label.appendChild(slider); label.appendChild(text);
                permCol.appendChild(label);
                const actionCol = document.createElement('div');
                actionCol.className = 'col-cmd-action';
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-del';
                delBtn.textContent = '删除';
                delBtn.onclick = () => row.remove();
                actionCol.appendChild(delBtn);
                row.appendChild(nameCol); row.appendChild(aliasCol);
                row.appendChild(permCol); row.appendChild(actionCol);
                container.appendChild(row);
            });
        }

        function addCommandRow() {
            const keyInput = document.getElementById('cmd-new-key');
            const valInput = document.getElementById('cmd-new-value');
            const key = keyInput.value.trim();
            if (!key) { showToast('请输入新命令名', 'error'); return; }
            const existing = Array.from(document.querySelectorAll('.cmd-cmd-name')).map(i => i.value.trim());
            if (existing.includes(key)) {
                showToast(`命令 "${key}" 已存在`, 'error'); return;
            }
            const container = document.getElementById('cmd-list-container');
            if (container.querySelector('.form-hint')) container.innerHTML = '';
            const permChecked = document.getElementById('cmd-new-perm').checked;
            const row = document.createElement('div');
            row.className = 'cmd-row';
            row.dataset.cmd = key;
            const nameCol = document.createElement('div'); nameCol.className = 'col-cmd-name';
            const ni = document.createElement('input'); ni.type='text'; ni.className='form-input cmd-cmd-name'; ni.value=key; ni.readOnly=true; ni.style.background='var(--bg-tertiary)'; ni.style.cursor='default'; nameCol.appendChild(ni);
            const aliasCol = document.createElement('div'); aliasCol.className = 'col-cmd-alias';
            const ai = document.createElement('input'); ai.type='text'; ai.className='form-input cmd-cmd-alias'; ai.value=valInput.value.trim(); ai.placeholder='逗号分隔'; aliasCol.appendChild(ai);
            const permCol = document.createElement('div'); permCol.className = 'col-cmd-perm';
            const label = document.createElement('label'); label.className='switch-label';
            const cb = document.createElement('input'); cb.type='checkbox'; cb.className='switch-input cmd-perm-cb'; cb.dataset.cmd=key; cb.checked=permChecked;
            const sl = document.createElement('span'); sl.className='switch-slider-sm';
            const tx = document.createElement('span'); tx.textContent='需管理';
            label.appendChild(cb); label.appendChild(sl); label.appendChild(tx); permCol.appendChild(label);
            const actCol = document.createElement('div'); actCol.className = 'col-cmd-action';
            const db = document.createElement('button'); db.className='btn-del'; db.textContent='删除'; db.onclick=()=>row.remove(); actCol.appendChild(db);
            row.appendChild(nameCol); row.appendChild(aliasCol); row.appendChild(permCol); row.appendChild(actCol);
            container.appendChild(row);
            keyInput.value = ''; valInput.value = ''; document.getElementById('cmd-new-perm').checked = false;
        }

        async function updateCommandConfig() {
            const prefix = document.getElementById('cmd-prefix').value.trim();
            if (!prefix) {
                showToast('命令前缀不能为空', 'error');
                return;
            }
            const nameInputs = document.querySelectorAll('.cmd-cmd-name');
            const aliasInputs = document.querySelectorAll('.cmd-cmd-alias');
            const aliases = {};
            const seen = new Set();
            for (let i = 0; i < nameInputs.length; i++) {
                const k = nameInputs[i].value.trim();
                const v = aliasInputs[i] ? aliasInputs[i].value.trim() : '';
                if (!k) continue;
                if (seen.has(k)) { showToast(`主命令名 "${k}" 重复`, 'error'); return; }
                seen.add(k);
                aliases[k] = v;
            }
            const permissions = {};
            document.querySelectorAll('.cmd-perm-cb').forEach(cb => {
                permissions[cb.dataset.cmd] = cb.checked;
            });
            try {
                const res = await fetch('/api/config/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prefix, aliases, permissions })
                });
                const json = await res.json();
                if (json.success) {
                    showToast('命令配置已更新并持久化', 'success');
                    loadCommandConfig();
                } else {
                    showToast('更新失败: ' + json.message, 'error');
                }
            } catch (e) { showToast('请求失败: ' + e.message, 'error'); }
        }

        async function loadCommandConfig() {
            try {
                const res = await fetch('/api/config/command');
                const json = await res.json();
                if (json.success) {
                    document.getElementById('cmd-prefix').value = json.prefix || '/';
                    renderCommandList(json.aliases || {}, json.permissions || {});
                }
            } catch (e) { console.error(e); }
        }

        checkAuth();
        loadCommandConfig();
        updateGeneralThemeUI();
    </script>
</body>
</html>
