<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=1">
    <title>ichikaBot 控制台</title>
    <link rel="stylesheet" href="/css/theme.css?v=20260815">
    <!-- Lucide 矢量图标库（defer：并行加载，不阻塞页面渲染） -->
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <style>
        .overview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .stat-icon {
            font-size: 24px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-unit {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .panel-body {
            padding: 20px;
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .quick-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .quick-link:hover {
            background: var(--border-color);
            transform: translateX(4px);
        }

        .quick-link-icon {
            font-size: 24px;
        }

        .quick-link-text {
            font-size: 14px;
            font-weight: 500;
        }

        .system-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .info-value {
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
        }

        .toast-container {
            position: fixed;
            top: calc(var(--navbar-height) + 16px);
            right: 16px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }

        .toast.success { border-left: 4px solid var(--accent-green); }
        .toast.error { border-left: 4px solid var(--accent-red); }
        .toast.info { border-left: 4px solid var(--accent-cyan); }

        @media (max-width: 1200px) {
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .overview-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .page-title { font-size: 22px; }
            .dashboard-grid { grid-template-columns: 1fr 1fr; }
            .stat-value { font-size: 22px; }
            .system-info { grid-template-columns: 1fr; }
            .quick-links { grid-template-columns: 1fr; }
            .toast-container { top: calc(var(--navbar-height) + 8px); right: 8px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <img src="/favicon.png?v=1" class="sidebar-brand-logo" alt="ichikaBot">
                <div class="sidebar-brand-text">
                    <span class="sidebar-logo-text">ichikaBot</span>
                    <span class="sidebar-logo-sub">webui</span>
                </div>
            </div>
            <button class="sidebar-collapse-btn" id="collapse-btn" onclick="ThemeManager.toggleSidebarCollapse()" title="收起侧边栏">
                <svg class="nav-icon collapse-icon-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
                <svg class="nav-icon collapse-icon-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group-title">监控中心</div>
            <a href="/" class="nav-item active">
                <i data-lucide="layout-dashboard" class="nav-icon"></i>
                <span>概览 Dashboard</span>
            </a>
            <a href="/monitor-page" class="nav-item">
                <i data-lucide="activity" class="nav-icon"></i>
                <span>实时监控 Monitor</span>
            </a>

            <div class="nav-group-title">核心配置</div>
            <a href="/command-page" class="nav-item">
                <i data-lucide="terminal" class="nav-icon"></i>
                <span>命令设置</span>
            </a>
            <a href="/ai-models-page" class="nav-item">
                <i data-lucide="cpu" class="nav-icon"></i>
                <span>AI 模型配置</span>
            </a>
            <a href="/search-source-page" class="nav-item">
                <i data-lucide="search" class="nav-icon"></i>
                <span>搜索源管理</span>
            </a>

            <div class="nav-group-title">资源管理</div>
            <a href="/memes-page" class="nav-item">
                <i data-lucide="image" class="nav-icon"></i>
                <span>表情包列表</span>
            </a>
            <a href="/batch-upload-page" class="nav-item">
                <i data-lucide="upload" class="nav-icon"></i>
                <span>批量上传</span>
            </a>

            <div class="nav-group-title">系统</div>
            <a href="/general-settings-page" class="nav-item">
                <i data-lucide="settings" class="nav-icon"></i>
                <span>通用设置</span>
            </a>
        </nav>
    </aside>

    <div id="sidebar-overlay" onclick="ThemeManager.closeSidebar()"></div>

    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" onclick="ThemeManager.toggleSidebar()"><i data-lucide="menu"></i></button>
            <img src="/favicon.png?v=1" class="topbar-logo" alt="logo">
            <span class="topbar-title">ichikaBot</span>
        </div>
        <div class="topbar-actions">
            <button class="btn btn-secondary btn-sm" onclick="handleLogout()">登出</button>
        </div>
    </header>

    <button class="sidebar-expand-btn" onclick="ThemeManager.toggleSidebarCollapse()" title="展开侧边栏">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
    </button>

    <main class="main-content">
        <div class="page-content">
            <div class="overview-header">
                <div>
                    <h1 class="page-title">仪表盘</h1>
                    <p class="page-subtitle">系统运行状态和资源监控</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary btn-sm" onclick="triggerGC()"><i data-lucide="trash-2"></i> 触发 GC</button>
                    <button class="btn btn-secondary btn-sm" onclick="handleLogout()"><i data-lucide="log-out"></i> 登出</button>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="stat-card">
                    <i data-lucide="database" class="stat-icon"></i>
                    <span class="stat-label">堆内存使用</span>
                    <span class="stat-value" id="heap-used">-- <span class="stat-unit">MB</span></span>
                </div>
                <div class="stat-card">
                    <i data-lucide="bar-chart-3" class="stat-icon"></i>
                    <span class="stat-label">最大堆内存</span>
                    <span class="stat-value" id="heap-max">-- <span class="stat-unit">MB</span></span>
                </div>
                <div class="stat-card">
                    <i data-lucide="monitor" class="stat-icon"></i>
                    <span class="stat-label">JVM 总内存</span>
                    <span class="stat-value" id="jvm-total">-- <span class="stat-unit">MB</span></span>
                </div>
                <div class="stat-card">
                    <i data-lucide="clock" class="stat-icon"></i>
                    <span class="stat-label">运行时间</span>
                    <span class="stat-value" id="uptime">--</span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">快捷操作</h2>
                </div>
                <div class="panel-body">
                    <div class="quick-links">
                        <a href="/monitor-page" class="quick-link">
                            <i data-lucide="activity" class="quick-link-icon"></i>
                            <span class="quick-link-text">实时监控</span>
                        </a>
                        <a href="/command-page" class="quick-link">
                            <i data-lucide="terminal" class="quick-link-icon"></i>
                            <span class="quick-link-text">命令设置</span>
                        </a>
                        <a href="/memes-page" class="quick-link">
                            <i data-lucide="image" class="quick-link-icon"></i>
                            <span class="quick-link-text">表情包管理</span>
                        </a>
                        <a href="/general-settings-page" class="quick-link">
                            <i data-lucide="settings" class="quick-link-icon"></i>
                            <span class="quick-link-text">通用设置</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">系统信息</h2>
                </div>
                <div class="panel-body">
                    <div class="system-info" id="system-info"></div>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="bottom-nav-items">
            <a href="/" class="bottom-nav-item active"><i data-lucide="layout-dashboard" class="nav-icon"></i><span>概览</span></a>
            <a href="/monitor-page" class="bottom-nav-item"><i data-lucide="activity" class="nav-icon"></i><span>监控</span></a>
            <a href="/memes-page" class="bottom-nav-item"><i data-lucide="image" class="nav-icon"></i><span>表情</span></a>
            <a href="/batch-upload-page" class="bottom-nav-item"><i data-lucide="upload" class="nav-icon"></i><span>上传</span></a>
            <a href="/general-settings-page" class="bottom-nav-item"><i data-lucide="settings" class="nav-icon"></i><span>设置</span></a>
        </div>
    </nav>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/theme.js"></script>
    <script>
        function showToast(msg, type='info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/monitor/memory');
                const json = await res.json();
                if (json.success) {
                    const d = json.data;
                    document.getElementById('heap-used').innerHTML = d.heapUsedMB + ' <span class="stat-unit">MB</span>';
                    document.getElementById('heap-max').innerHTML = d.heapMaxMB + ' <span class="stat-unit">MB</span>';
                    document.getElementById('jvm-total').innerHTML = d.jvmTotalMB + ' <span class="stat-unit">MB</span>';
                }
            } catch (e) { console.error(e); }
        }

        let bootTime = 0;

        function formatUptime(ms) {
            const s = Math.floor(ms / 1000) % 60;
            const m = Math.floor(ms / 60000) % 60;
            const h = Math.floor(ms / 3600000);
            return `${h}小时${m}分${s}秒`;
        }

        function updateUptime() {
            if (!bootTime) return;
            const el = document.getElementById('uptime');
            if (el) el.textContent = formatUptime(Date.now() - bootTime);
        }

        async function loadJvmInfo() {
            try {
                const res = await fetch('/monitor/jvm');
                const json = await res.json();
                if (json.success) {
                    const uptimeMs = json.uptime?.uptimeMs || 0;
                    if (uptimeMs) bootTime = Date.now() - uptimeMs;

                    const infoHtml = `
                        <div class="info-item"><span class="info-label">Java 版本</span><span class="info-value">${json.jvm?.javaVersion || '--'}</span></div>
                        <div class="info-item"><span class="info-label">JVM 厂商</span><span class="info-value">${json.jvm?.javaVendor || '--'}</span></div>
                        <div class="info-item"><span class="info-label">操作系统</span><span class="info-value">${json.jvm?.osName || '--'}</span></div>
                        <div class="info-item"><span class="info-label">运行时间</span><span class="info-value" id="uptime">${json.uptime?.formatted || '--'}</span></div>
                    `;
                    document.getElementById('system-info').innerHTML = infoHtml;
                }
            } catch (e) { console.error(e); }
        }

        async function triggerGC() {
            if (!confirm('确定要触发GC吗？')) return;
            try {
                showToast('正在触发GC...', 'info');
                const res = await fetch('/monitor/gc', { method: 'POST' });
                const json = await res.json();
                if (json.success) {
                    showToast('GC完成: ' + json.currentMemory.heapUsedMB + 'MB', 'success');
                    loadDashboard();
                } else {
                    showToast('GC失败', 'error');
                }
            } catch (e) {
                showToast('请求失败: ' + e.message, 'error');
            }
        }

        async function handleLogout() {
            try {
                const res = await fetch('/api/auth/logout', { method: 'POST' });
                if (res.ok) window.location.href = '/login';
            } catch (e) {
                window.location.href = '/login';
            }
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/status');
                const json = await res.json();
                if (!json.authenticated) window.location.href = '/login';
            } catch (e) {}
        }

        checkAuth();
        loadDashboard();
        loadJvmInfo();
        setInterval(loadDashboard, 5000);
        setInterval(updateUptime, 1000);
    </script>
</body>
</html>
