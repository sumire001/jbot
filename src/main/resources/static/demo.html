<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置管理 - ichikaBot</title>
    <style>
        /* 基础样式重置 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f7fa; padding: 20px; color: #333; }
        
        .config-panel {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto;
            overflow: hidden;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #ebeef5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .badge { background: #e6f7ff; color: #1890ff; font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px solid #91d5ff; }

        .panel-body { padding: 20px; }

        /* 通用表单元素 */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #409eff; outline: none; }
        .form-hint { font-size: 12px; color: #909399; margin-top: 4px; }

        /* --- 核心优化：紧凑列表布局 --- */
        .cmd-list-header {
            display: flex;
            padding: 10px 15px;
            background: #f5f7fa;
            border-radius: 4px;
            font-size: 12px;
            color: #606266;
            margin-bottom: 10px;
            align-items: center;
        }

        .cmd-row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #ebeef5;
            gap: 15px;
            transition: background 0.2s;
        }
        .cmd-row:hover { background: #fafafa; }
        .cmd-row:last-child { border-bottom: none; }

        /* 列宽定义 */
        .col-main { flex: 2; min-width: 120px; } /* 主命令名 */
        .col-alias { flex: 3; min-width: 150px; } /* 别名 */
        .col-perm { width: 140px; display: flex; align-items: center; justify-content: center; } /* 权限开关 */
        .col-action { width: 60px; text-align: right; } /* 删除按钮 */

        /* 权限开关样式 (Toggle Switch) */
        .switch-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
            color: #606266;
            user-select: none;
        }
        .switch-input { display: none; }
        .switch-slider {
            position: relative;
            width: 36px;
            height: 20px;
            background-color: #dcdfe6;
            border-radius: 20px;
            margin-right: 8px;
            transition: .3s;
        }
        .switch-slider:before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            border-radius: 50%;
            transition: .3s;
        }
        .switch-input:checked + .switch-slider { background-color: #409eff; }
        .switch-input:checked + .switch-slider:before { transform: translateX(16px); }

        /* 按钮样式 */
        .btn { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-danger { background: #fef0f0; color: #f56c6c; }
        .btn-danger:hover { background: #f56c6c; color: white; }
        .btn-primary { background: #409eff; color: white; width: 100%; padding: 10px; font-size: 14px; margin-top: 20px;}
        .btn-primary:hover { background: #66b1ff; }

        /* 添加行样式 */
        .add-row {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #dcdfe6;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="config-panel">
    <div class="panel-header">
        <h2 class="panel-title">命令配置 <span class="badge">可热更新</span></h2>
    </div>

    <div class="panel-body">
        <!-- 全局前缀配置 -->
        <div class="form-group">
            <label class="form-label">命令前缀</label>
            <input type="text" id="cmd-prefix" class="form-input" maxlength="4" value="/" style="max-width: 100px;">
            <div class="form-hint">所有命令必须以此开头，最长 4 字符。</div>
        </div>

        <!-- 列表表头 -->
        <div class="cmd-list-header">
            <div class="col-main">主命令名</div>
            <div class="col-alias">别名 (逗号分隔)</div>
            <div class="col-perm">管理员权限</div>
            <div class="col-action">操作</div>
        </div>

        <!-- 动态列表容器 -->
        <div id="cmd-list-container">
            <!-- 示例数据行 -->
            <div class="cmd-row">
                <div class="col-main">
                    <input type="text" class="form-input" value="偷一下" readonly style="background:#f5f7fa;">
                </div>
                <div class="col-alias">
                    <input type="text" class="form-input" value="steal,上传">
                </div>
                <div class="col-perm">
                    <label class="switch-label">
                        <input type="checkbox" class="switch-input" checked>
                        <span class="switch-slider"></span>
                        <span>需管理</span>
                    </label>
                </div>
                <div class="col-action">
                    <button class="btn btn-danger" onclick="this.closest('.cmd-row').remove()">删除</button>
                </div>
            </div>

            <div class="cmd-row">
                <div class="col-main">
                    <input type="text" class="form-input" value="enable" readonly style="background:#f5f7fa;">
                </div>
                <div class="col-alias">
                    <input type="text" class="form-input" value="ai开关">
                </div>
                <div class="col-perm">
                    <label class="switch-label">
                        <input type="checkbox" class="switch-input">
                        <span class="switch-slider"></span>
                        <span>需管理</span>
                    </label>
                </div>
                <div class="col-action">
                    <button class="btn btn-danger" onclick="this.closest('.cmd-row').remove()">删除</button>
                </div>
            </div>
             <!-- 更多行... -->
        </div>

        <!-- 底部添加栏 -->
        <div class="add-row">
            <div class="col-main">
                <input type="text" id="new-key" class="form-input" placeholder="新命令名">
            </div>
            <div class="col-alias">
                <input type="text" id="new-alias" class="form-input" placeholder="别名(可选)">
            </div>
            <div class="col-perm">
                 <label class="switch-label">
                    <input type="checkbox" id="new-perm" class="switch-input">
                    <span class="switch-slider"></span>
                    <span>需管理</span>
                </label>
            </div>
            <div class="col-action">
                <button class="btn btn-primary" style="margin-top:0; width:auto;" onclick="alert('此处调用JS添加逻辑')">添加</button>
            </div>
        </div>

        <button class="btn btn-primary" onclick="updateCommandConfig()">保存全部配置</button>
    </div>
</div>

<script>
    // 简单的JS逻辑示意
    function updateCommandConfig() {
        const rows = document.querySelectorAll('.cmd-row');
        const config = [];
        rows.forEach(row => {
            const key = row.querySelector('.col-main input').value;
            const alias = row.querySelector('.col-alias input').value;
            const isPerm = row.querySelector('.col-perm input').checked;
            config.push({ key, alias, isPerm });
        });
        console.log("提交的数据:", JSON.stringify(config));
        alert("配置已准备提交，请查看控制台");
    }
</script>

</body>
</html>
