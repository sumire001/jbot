<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>System Status Dashboard</title>

    <style>
        /* 基础样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 优雅的系统自带艺术衬线字体 */
            font-family: "Georgia", "Times New Roman", "Noto Serif SC", "Songti SC", "SimSun", serif;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2b2c31;
        }

        /* 主容器 */
        .dashboard {
            width: 920px;
            min-height: 580px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            display: flex;
            background-color: #ffffff;
        }

        /* === 左侧系统信息边栏 === */
        .sidebar {
            width: 300px;
            padding: 35px 28px;
            background: #f7f6f2;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 45px;
            position: relative;
        }

        .profile-avatar-container {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #eae7e0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* 真实头像图（{{AVATAR_TAG}} 注入，占满圆形容器） */
        .profile-avatar-img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #34c759;
            border-radius: 50%;
            position: absolute;
            left: 45px;
            top: 38px;
            border: 2px solid #f7f6f2;
        }

        .profile-info {
            margin-left: 18px;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 500;
            color: #23242a;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .profile-id {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.35);
            font-family: "Georgia", "Times New Roman", serif;
        }

        .section-title {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.35);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            margin-right: 10px;
        }

        .info-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
        }

        .info-icon {
            width: 16px;
            height: 16px;
            background-color: rgba(0, 0, 0, 0.06);
            border-radius: 3px;
            margin-right: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .info-text {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.5);
            line-height: 1.5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .info-text strong {
            color: #23242a;
            font-weight: 500;
        }

        /* === 右侧硬件内容区 === */
        .main-content {
            flex: 1;
            position: relative;
            z-index: 1;
            background-image: url('{{BG_IMAGE}}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 浅色蒙版：压暗色背景图为淡淡纹理，保证深色文字可读 */
        .main-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.94) 100%);
            z-index: -1;
        }

        .resource-grid {
            display: flex;
            flex-direction: column;
            gap: 50px;
            position: relative;
            z-index: 2;
        }

        .resource-section h2 {
            font-family: "Georgia", "Times New Roman", "Noto Serif SC", "Songti SC", serif;
            font-size: 18px;
            color: #23242a;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .resource-section h2 .icon-svg {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            fill: none;
            stroke: rgba(0, 0, 0, 0.55);
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 双列布局网格 */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
            align-items: flex-end; /* 让内容在底部对齐，保证视觉整齐 */
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.4);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 16px;
            color: #23242a;
            font-weight: 400;
        }

        /* 内存环形图表（环形进度由 {{MEM_RING}} 内联注入） */
        .memory-chart {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chart-inner {
            width: 92px;
            height: 92px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .chart-percent {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 24px;
            font-weight: 500;
            color: #23242a;
            letter-spacing: 1px;
        }

        .chart-label {
            font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.4);
            margin-top: 4px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 左侧系统信息 -->
        <aside class="sidebar">
            <div class="profile-header">
                <div class="profile-avatar-container">{{AVATAR_TAG}}</div>
                <div class="status-dot"></div>
                <div class="profile-info">
                    <div class="profile-name">{{BOT_NAME}}</div>
                    <div class="profile-id">{{BOT_ID}}</div>
                </div>
            </div>

            <div class="section-title">系统信息</div>
            <ul class="info-list">
                <li class="info-item">
                    <div class="info-icon"></div>
                    <div class="info-text">NapCat 版本 <strong>{{NAPCAT_VERSION}}</strong></div>
                </li>
                <li class="info-item">
                    <div class="info-icon"></div>
                    <div class="info-text">QQ 版本 <strong>{{QQ_VERSION}}</strong></div>
                </li>
                <li class="info-item">
                    <div class="info-icon"></div>
                    <div class="info-text">系统版本 <strong>{{SYSTEM_VERSION}}</strong></div>
                </li>
            </ul>
        </aside>

        <!-- 右侧硬件数据区 -->
        <main class="main-content">
            <div class="resource-grid">

                <!-- CPU 模块 -->
                <div class="resource-section">
                    <h2>
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <rect x="5" y="5" width="14" height="14" rx="2" ry="2"></rect>
                            <rect x="9" y="9" width="6" height="6" rx="1" ry="1"></rect>
                            <line x1="8" y1="1" x2="8" y2="5"></line>
                            <line x1="12" y1="1" x2="12" y2="5"></line>
                            <line x1="16" y1="1" x2="16" y2="5"></line>
                            <line x1="8" y1="19" x2="8" y2="23"></line>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="16" y1="19" x2="16" y2="23"></line>
                            <line x1="1" y1="8" x2="5" y2="8"></line>
                            <line x1="1" y1="12" x2="5" y2="12"></line>
                            <line x1="1" y1="16" x2="5" y2="16"></line>
                            <line x1="19" y1="8" x2="23" y2="8"></line>
                            <line x1="19" y1="12" x2="23" y2="12"></line>
                            <line x1="19" y1="16" x2="23" y2="16"></line>
                        </svg>
                        CPU
                    </h2>
                    <div class="details-grid">
                        <div class="detail-item">
                            <span class="detail-label">型号</span>
                            <span class="detail-value">{{CPU_MODEL}}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">主频</span>
                            <span class="detail-value">{{CPU_FREQ}}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">内核数</span>
                            <span class="detail-value">{{CPU_CORES}}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">bot进程</span>
                            <span class="detail-value">{{JVM_CPU}}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">使用率</span>
                            <span class="detail-value">{{CPU_USAGE}}</span>
                        </div>
                    </div>
                </div>

                <!-- 内存 模块 -->
                <div class="resource-section">
                    <h2>
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M4 6L4 17C4 17.5523 4.44772 18 5 18H19C19.5523 18 20 17.5523 20 17V6H16L14 4H6C5.44772 4 5 4.44772 5 5V6H4Z" stroke="rgba(0,0,0,0.5)" stroke-width="1.2" stroke-linejoin="round" fill="none"></path>
                            <line x1="7" y1="18" x2="7" y2="22"></line>
                            <line x1="10" y1="18" x2="10" y2="22"></line>
                            <line x1="14" y1="18" x2="14" y2="22"></line>
                            <line x1="17" y1="18" x2="17" y2="22"></line>
                        </svg>
                        内存
                    </h2>
                    <div class="details-grid">
                        <div class="detail-item">
                            <span class="detail-label">总量</span>
                            <span class="detail-value">{{MEM_TOTAL}}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">使用量</span>
                            <span class="detail-value">{{MEM_USED}}</span>
                        </div>
                        <!-- 内存环形图 -->
                        <div class="memory-chart" style="background: {{MEM_RING}}">
                            <div class="chart-inner">
                                <div class="chart-percent">{{MEM_PCT}}</div>
                                <div class="chart-label">内存占用</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
